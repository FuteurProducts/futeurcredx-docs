<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Test</title>
</head>
<body>
    <h1>Vite Proxy Test</h1>
    <p>This page tests if the Vite proxy is working correctly.</p>
    
    <button onclick="testProxy()">Test Proxy Connection</button>
    <div id="result"></div>

    <script>
        async function testProxy() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                console.log('Testing proxy connection...');
                
                // Test the proxy endpoint
                const response = await fetch('/api/v1');
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (response.ok) {
                    const data = await response.text();
                    console.log('Response data:', data);
                    resultDiv.innerHTML = `
                        <h3>✅ Proxy Test Successful!</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Response:</strong> ${data}</p>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3>❌ Proxy Test Failed</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Status Text:</strong> ${response.statusText}</p>
                    `;
                }
            } catch (error) {
                console.error('Proxy test failed:', error);
                resultDiv.innerHTML = `
                    <h3>❌ Proxy Test Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
